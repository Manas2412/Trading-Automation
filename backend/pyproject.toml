[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrade"
version = "0.0.1"
description = "Personal systematic trading platform (India / Zerodha Kite Connect)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "cvxpy>=1.4",
    "pandas-market-calendars>=4.3",
    "kiteconnect>=5.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "prefect>=2.16",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "hypothesis>=6.100",
]
dashboard = [
    "streamlit>=1.33",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
